<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BoBine</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0C0907; color: #F3E6CC; font: 16px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 360px; padding: 24px 16px; text-align: center; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.5px; }
  p { color: #B9AC95; margin: 0 0 24px; }
  a.open { display: inline-block; padding: 14px 26px; border-radius: 26px; background: #E2582A;
           color: #0C0907; font-weight: 700; text-decoration: none; }
  small { display: block; margin-top: 20px; color: #8E8372; }
</style>
</head>
<body>
<main>
  <h1>BoBine</h1>
  <p id="who">Un titre à regarder.</p>
  <a class="open" id="open" href="nuvio://">Ouvrir dans BoBine</a>
  <small id="hint">Rien ne s'ouvre ? BoBine n'est pas installée sur cet appareil.</small>
</main>
<script>
  // Lien : …/bobine/#film/tt0816692?de=Seb. Tout ce qui suit « # » reste dans le navigateur :
  // GitHub ne reçoit ni le titre ni le prénom.
  (function () {
    var hash = location.hash.replace(/^#/, "");
    var parts = hash.split("?");
    var path = parts[0].split("/");
    var kind = path[0] === "serie" ? "series" : (path[0] === "film" ? "movie" : null);
    var id = path[1] ? decodeURIComponent(path[1]) : "";
    var from = "";
    if (parts[1]) {
      parts[1].split("&").forEach(function (pair) {
        var kv = pair.split("=");
        if (kv[0] === "de" && kv[1]) from = decodeURIComponent(kv[1]);
      });
    }
    if (!kind || !/^[A-Za-z0-9:._-]{1,64}$/.test(id)) {
      document.getElementById("who").textContent = "Ce lien BoBine est incomplet.";
      return;
    }
    var url = "nuvio://meta?type=" + kind + "&id=" + encodeURIComponent(id) +
      (from ? "&from=" + encodeURIComponent(from.slice(0, 40)) : "");
    document.getElementById("open").href = url;
    if (from) document.getElementById("who").textContent = from + " vous partage un titre.";
    location.href = url;
  })();
</script>
</body>
</html>
